  <script>/* Service Order document (2026-10-27, per Catalina) — what the customer signs in DocuSign at the Contract step.
   Visual language = the proposal PDF (vc-doc-shell page, red #ee001e titles, black title bars, zebra tables);
   structure = Leo's invoice (presentation pp. 161–166): Contract / Order blocks, one line per bundle (or per
   subscription), Discount / Promo as negative rows under each line, totals in the same order.
   VC.serviceOrderDoc(data)            -> HTML (one or more .vc-doc-shell pages)
   VC.serviceOrderDemoData(scenario)   -> sample data for the design page / simulation
   Design page: ValuCal-MSA/componentization/service-order-doc.html. Brief: componentization/briefs/36-service-order-document.md */
(function () {
  window.VC = window.VC || {};

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => {
    const v = Math.round((Number(n) || 0) * 100) / 100;
    const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (v < 0 ? '-$' : '$') + s;
  };
  const LOGO = () => {
    const base = (typeof VC_IMG !== 'undefined' && VC_IMG) ? VC_IMG : '../../assets-shared/img/';
    return '<img class="vc-sodoc__logo" src="' + base + 'logo.svg" alt="Verizon Connect">';
  };
  const DISCLAIMER = 'This Order is governed by the Master Service Agreement referenced above. Prices exclude taxes, '
    + 'which are calculated on each invoice. Verizon confidential and proprietary.';

  /* ---------- sample data ---------- */
  const CATALOG = {
    essential: { name: 'Essential Safety Bundle', subs: [{ name: 'Vehicle Tracking (VTU)', price: 30 }, { name: 'Dash Cam', price: 15 }] },
    pro: { name: 'Pro Safety Bundle', subs: [{ name: 'Vehicle Tracking (VTU)', price: 30 }, { name: 'AI Dual Cam', price: 22 }, { name: 'Driver ID', price: 10 }] }
  };

  VC.serviceOrderDemoData = function (sc) {
    sc = Object.assign({ bundles: true, alacarte: false, msaDiscount: true, itemized: false, promo: false, schedule: false, oneTime: false, existing: false }, sc || {});
    const discountPct = sc.msaDiscount ? 10 : 0; // simulation: MSA discount on / off (2026-10-27)
    const promo = sc.promo ? { pct: 5, months: 6, name: 'LevelUp 5%', text: 'LevelUp promotion: 5% off the monthly subscription for the first 6 months of each unit\u2019s service, starting on its billing start date. After month 6 the contracted price applies. Removing units during the promotion ends the promotion for those units.' } : null;
    const qty = { essential: 30, pro: 20 };
    // Subscriptions: bundles, à la carte, or both in the same order (2026-10-27, per Catalina).
    if (!sc.bundles && !sc.alacarte) sc.bundles = true;
    let lines = [];
    if (sc.bundles) {
      lines = Object.keys(qty).map(k => ({
        kind: 'bundle', name: CATALOG[k].name, qty: qty[k],
        price: CATALOG[k].subs.reduce((s, x) => s + x.price, 0),
        subs: sc.itemized ? CATALOG[k].subs.slice() : []
      }));
    }
    if (sc.alacarte) {
      lines = lines.concat(sc.bundles
        ? [
          // Only subscriptions that stand on their own (a feature like Driver ID always needs a VTU — 2026-10-27).
          { kind: 'sub', name: 'Vehicle Tracking (VTU)', qty: 10, price: 30, subs: [] },
          { kind: 'sub', name: 'Powered Asset Tracker', qty: 10, price: 18, subs: [] }
        ]
        : [
          // The promotion applies to some subscriptions only (VTU and Dash Cam) — 2026-10-27, per Catalina.
          { kind: 'sub', name: 'Vehicle Tracking (VTU)', qty: 50, price: 30, subs: [], promoPct: sc.promo ? undefined : 0 },
          { kind: 'sub', name: 'Dash Cam', qty: 30, price: 15, subs: [], promoPct: sc.promo ? undefined : 0 },
          { kind: 'sub', name: 'AI Dual Cam', qty: 20, price: 22, subs: [], promoPct: 0 },
          { kind: 'sub', name: 'Driver ID', qty: 20, price: 10, subs: [], promoPct: 0 }
        ]);
    }
    const units = (sc.bundles ? qty.essential + qty.pro : 50) + (sc.bundles && sc.alacarte ? 10 : 0);
    const split = (first) => {
      const o = {};
      lines.forEach(l => { o[l.name] = first ? Math.ceil(l.qty * 0.6) : l.qty - Math.ceil(l.qty * 0.6); });
      return o;
    };
    return {
      orderNumber: '5003808673',
      orderDate: '10/27/2026',
      rep: 'Sarah Patel',
      customer: { name: 'Acme Logistics', account: '1000212803', address: '1200 Peachtree St NE, Atlanta, GA 30309', contact: 'Laura Mendez' },
      agreement: sc.existing
        ? { number: 'MSA-0004127', start: '01/01/2026', end: '12/31/2028', term: 'Co-term with MSA', rampUp: 30, coTerm: true }
        : { number: 'MSA-0004127', start: '11/01/2026', end: '10/31/2029', term: '36 months', rampUp: 30, coTerm: false },
      discountPct, promo, lines, units,
      schedule: sc.schedule ? [
        { number: '5003808673', when: 'At signature', billingStart: '11/26/2026', qty: split(true) },
        { number: '5003809104', when: '+60 days', billingStart: '01/25/2027', qty: split(false) }
      ] : null,
      oneTime: sc.oneTime ? [
        { name: 'Key fobs', type: 'Hardware', qty: 10, price: 15 },
        { name: 'On-site professional installation', type: 'Professional service', qty: units, price: 99, waived: true }
      ] : []
    };
  };

  /* ---------- totals ---------- */
  // A line can carry its own discount / promo % (real options); otherwise the document's.
  const discOf = (d, l) => (l.discountPct != null ? l.discountPct : d.discountPct) || 0;
  const promoOf = (d, l) => (l.promoPct != null ? l.promoPct : (d.promo ? d.promo.pct : 0)) || 0;
  const pctText = n => (Math.round(n * 100) / 100) + '%';
  // A bundle's name without a trailing "Bundle" — the "Bundle" label above it already says it (2026-10-27, per Catalina).
  const lineName = l => l.kind === 'bundle' ? String(l.name || '').replace(/\s+bundle$/i, '') : l.name;

  function computeTotals(d) {
    const t = { list: 0, discount: 0, promo: 0, oneTimeList: 0, oneTimeWaived: 0 };
    d.lines.forEach(l => {
      const ext = l.price * l.qty;
      t.list += ext;
      t.discount -= ext * discOf(d, l) / 100;
      t.promo -= ext * (1 - discOf(d, l) / 100) * promoOf(d, l) / 100;
    });
    d.oneTime.forEach(o => { t.oneTimeList += o.price * o.qty; if (o.waived) t.oneTimeWaived -= o.price * o.qty; });
    t.monthlyContracted = t.list + t.discount;
    t.monthlyPromo = t.monthlyContracted + t.promo;
    t.oneTime = t.oneTimeList + t.oneTimeWaived;
    return t;
  }

  /* ---------- pieces ---------- */
  function infoBlock(title, fields, inline) {
    return '<section class="vc-sodoc__block' + (inline ? ' vc-sodoc__block--inline' : '') + '"><div class="vc-sodoc__block-title">' + esc(title) + '</div><dl class="vc-sodoc__fields">'
      + fields.map(f => '<div class="vc-sodoc__field"><dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1] == null || f[1] === '' ? '--' : f[1]) + '</dd></div>').join('')
      + '</dl></section>';
  }

  // Column order like the proposal PDF: Qty first, then the item (2026-10-27, per Catalina): # · Qty · Item · Charge type · Unit price · Ext.
  const tr = (cls, ref, qty, item, itemCls, type, unit, ext, extCls) => '<tr class="' + cls + '"><td class="vc-sodoc__ref">' + ref + '</td>'
    + '<td class="vc-sodoc__qty">' + qty + '</td><td class="' + itemCls + '">' + item + '</td><td>' + type + '</td>'
    + '<td class="vc-sodoc__num">' + unit + '</td><td class="vc-sodoc__num' + (extCls ? ' ' + extCls : '') + '">' + ext + '</td></tr>';
  const thead = extLabel => '<thead><tr><th class="vc-sodoc__ref">Line</th><th class="vc-sodoc__qty">QTY</th><th>Item</th><th>Charge type</th><th class="vc-sodoc__num">Unit price</th><th class="vc-sodoc__num">' + extLabel + '</th></tr></thead>';

  function servicesTable(d) {
    let n = 0;
    const rows = [];
    // Discount / promo rows: no QTY (it's the line's quantity right above — 2026-10-27, per Catalina).
    const neg = (label, type, unit, qty, cls) => tr('vc-sodoc__row--adj ' + cls, '', '', '\u2013 ' + esc(label), 'vc-sodoc__adj-label', type, money(unit), money(unit * qty));
    d.lines.forEach(l => {
      n += 1;
      const contracted = l.price * (1 - discOf(d, l) / 100);
      // Itemized: what the bundle includes as a comma-separated line under its name — no prices, no sub-rows (2026-10-27).
      const includes = l.subs.length ? '<div class="vc-sodoc__includes">' + l.subs.map(x => esc(x.name)).join(', ') + '</div>' : '';
      rows.push(tr('vc-sodoc__row--line', n, l.qty, (l.kind === 'bundle' ? '<span class="vc-sodoc__item-sub">Bundle</span>' : '') + esc(lineName(l)) + includes, 'vc-sodoc__item', 'Recurring', money(l.price), money(l.price * l.qty)));
      if (discOf(d, l)) rows.push(neg('MSA discount (' + pctText(discOf(d, l)) + ')', 'Discount', -l.price * discOf(d, l) / 100, l.qty, 'is-discount'));
      if (promoOf(d, l)) rows.push(neg('Promo' + (d.promo && d.promo.months ? ' months 1\u2013' + d.promo.months : '') + ' (' + pctText(promoOf(d, l)) + ')', 'Promo', -contracted * promoOf(d, l) / 100, l.qty, 'is-promo'));
    });
    return '<table class="vc-sodoc__table">' + thead('Ext. monthly') + '<tbody>' + rows.join('') + '</tbody></table>';
  }

  function oneTimeTable(d) {
    if (!d.oneTime.length) return '';
    const rows = [];
    d.oneTime.forEach((o, i) => {
      rows.push(tr('vc-sodoc__row--line', i + 1, o.qty, esc(o.name), 'vc-sodoc__item', esc(o.type), money(o.price), money(o.price * o.qty)));
      if (o.waived) rows.push(tr('vc-sodoc__row--adj is-promo', '', '', '\u2013 Waived', 'vc-sodoc__adj-label', 'Promo', money(-o.price), money(-o.price * o.qty)));
    });
    return '<h3 class="vc-sodoc__section-title vc-sodoc__section-title--table">One-time charges</h3><table class="vc-sodoc__table">' + thead('Ext. price') + '<tbody>' + rows.join('') + '</tbody></table>';
  }

  function totalsBlock(d, t) {
    const r = (label, value, cls) => '<div class="vc-sodoc__total ' + (cls || '') + '"><span>' + esc(label) + '</span><span>' + value + '</span></div>';
    let html = '<div class="vc-sodoc__totals">';
    html += r('Monthly subtotal at list', money(t.list));
    const pcts = Array.from(new Set(d.lines.map(l => discOf(d, l))));
    if (t.discount) html += r('MSA discount' + (pcts.length === 1 ? ' (' + pctText(pcts[0]) + ')' : ''), money(t.discount), 'is-discount');
    if (t.promo && !(d.promo && d.promo.months)) {
      html += r('Promotions', money(t.promo), 'is-promo');
      html += r('Monthly total', money(t.monthlyPromo), 'is-strong');
    } else if (d.promo) {
      html += r('Promo months 1\u2013' + d.promo.months + ' (' + d.promo.pct + '%)', money(t.promo), 'is-promo');
      html += r('Monthly total, months 1\u2013' + d.promo.months, money(t.monthlyPromo), 'is-strong');
      html += r('Monthly total, from month ' + (d.promo.months + 1), money(t.monthlyContracted), 'is-strong');
    } else {
      html += r('Monthly total', money(t.monthlyContracted), 'is-strong');
    }
    if (d.oneTime.length) {
      html += r('One-time charges at list', money(t.oneTimeList));
      if (t.oneTimeWaived) html += r('Waived', money(t.oneTimeWaived), 'is-promo');
      html += r('One-time total', money(t.oneTime), 'is-strong');
    }
    html += r('First month total' + (d.oneTime.length ? ' (incl. one-time)' : ''), money(t.monthlyPromo + t.oneTime), 'is-grand');
    html += '<div class="vc-sodoc__tax-note">Taxes are calculated on each invoice.</div></div>';
    return html;
  }

  function scheduleBlock(d) {
    if (!d.schedule) return '';
    const items = d.lines.map(l => l.name);
    const itemLabel = Object.fromEntries(d.lines.map(l => [l.name, lineName(l)]));
    const head = '<tr><th>Order</th><th>Starts</th><th>Billing start</th>' + items.map(i => '<th class="vc-sodoc__num">' + esc(itemLabel[i]) + '</th>').join('') + '</tr>';
    const rows = d.schedule.map(o => '<tr class="vc-sodoc__row--plain"><td>' + esc(o.number) + '</td><td>' + esc(o.when) + '</td><td>' + esc(o.billingStart) + '</td>'
      + items.map(i => '<td class="vc-sodoc__num">' + (o.qty[i] != null ? o.qty[i] : '--') + '</td>').join('') + '</tr>').join('');
    const totals = '<tr class="vc-sodoc__row--total"><td>Total committed</td><td></td><td></td>' + d.lines.map(l => '<td class="vc-sodoc__num">' + l.qty + '</td>').join('') + '</tr>';
    return '<h3 class="vc-sodoc__section-title">Order schedule</h3><p class="vc-sodoc__note vc-sodoc__note--table">Units enter fulfillment in the orders below. Each order\u2019s units start billing after the ' + d.agreement.rampUp + '-day ramp-up period.</p>'
      + '<table class="vc-sodoc__table"><thead>' + head + '</thead><tbody>' + rows + totals + '</tbody></table>';
  }

  function termsBlock(d) {
    let html = '<h3 class="vc-sodoc__section-title">Terms</h3><ul class="vc-sodoc__terms">'
      + '<li>This Order is part of Master Service Agreement ' + esc(d.agreement.number) + ' and is governed by its terms.</li>'
      + (d.agreement.coTerm
        ? '<li>Services on this order co-term with the MSA and end on ' + esc(d.agreement.end) + '.</li>'
        : '<li>Service term: ' + esc(d.agreement.term) + ', from ' + esc(d.agreement.start) + ' to ' + esc(d.agreement.end) + '.</li>')
      + '<li>Billing for each unit starts after a ' + d.agreement.rampUp + '-day ramp-up period.</li>'
      + '<li>Prices are monthly per unit and exclude taxes.</li></ul>';
    if (d.promo) html += '<div class="vc-sodoc__promo-terms"><div class="vc-sodoc__promo-title">Promotion terms \u2014 ' + esc(d.promo.name) + '</div><p>' + esc(d.promo.text) + '</p></div>';
    return html;
  }

  function signatureBlock(signed) {
    if (signed) {
      const done = (title, s) => '<section class="vc-sodoc__block vc-sodoc__sign"><div class="vc-sodoc__block-title">' + title + '</div><div class="vc-sodoc__sign-grid">'
        + '<div class="vc-sodoc__sign-field vc-sodoc__sign-field--wide"><span class="vc-sodoc__signed">' + esc(s.name) + '</span><label>Signature</label></div>'
        + '<div class="vc-sodoc__sign-field"><span class="vc-sodoc__sign-value">' + esc(s.name) + '</span><label>Name</label></div>'
        + '<div class="vc-sodoc__sign-field"><span class="vc-sodoc__sign-value">' + esc(s.title || '--') + '</span><label>Title</label></div>'
        + '<div class="vc-sodoc__sign-field"><span class="vc-sodoc__sign-value">' + esc(s.date) + '</span><label>Date</label></div>'
        + (s.po !== undefined ? '<div class="vc-sodoc__sign-field"><span class="vc-sodoc__sign-value">' + esc(s.po || '--') + '</span><label>PO number</label></div>' : '<div></div>')
        + '</div></section>';
      return '<div class="vc-sodoc__signatures">' + done('Customer', signed.customer) + done('Verizon Connect', signed.verizon) + '</div>';
    }
    // DocuSign: tabs are placed on the anchors (white text in the real PDF), never on moving content.
    const party = (title, n, withPo) => '<section class="vc-sodoc__block vc-sodoc__sign"><div class="vc-sodoc__block-title">' + title + '</div>'
      + '<div class="vc-sodoc__sign-grid">'
      + '<div class="vc-sodoc__sign-field vc-sodoc__sign-field--wide"><span class="vc-sodoc__tab vc-sodoc__tab--sign">Sign here</span><span class="vc-sodoc__anchor">\\s' + n + '\\</span><label>Signature</label></div>'
      + '<div class="vc-sodoc__sign-field"><span class="vc-sodoc__tab">Full name</span><span class="vc-sodoc__anchor">\\n' + n + '\\</span><label>Name</label></div>'
      + '<div class="vc-sodoc__sign-field"><span class="vc-sodoc__tab">Title</span><span class="vc-sodoc__anchor">\\t' + n + '\\</span><label>Title</label></div>'
      + '<div class="vc-sodoc__sign-field"><span class="vc-sodoc__tab">Date signed</span><span class="vc-sodoc__anchor">\\d' + n + '\\</span><label>Date</label></div>'
      + (withPo ? '<div class="vc-sodoc__sign-field"><span class="vc-sodoc__tab">PO number (optional)</span><span class="vc-sodoc__anchor">\\po' + n + '\\</span><label>PO number</label></div>' : '<div></div>')
      + '</div></section>';
    return '<div class="vc-sodoc__signatures">' + party('Customer', 1, true) + party('Verizon Connect', 2, false) + '</div>';
  }

  function page(content, num, total, d) {
    return '<div class="doc-page-outer vc-sodoc__page-outer"><div class="vc-doc-shell vc-sodoc"><div class="vc-doc-brand-line"></div><div class="vc-doc-inner vc-sodoc__inner">'
      + (d.envelopeId ? '<div class="vc-sodoc__envelope">DocuSign Envelope ID: ' + esc(d.envelopeId) + '</div>' : '')
      + content
      + '<footer class="vc-sodoc__footer"><div>' + esc(DISCLAIMER) + '</div><div class="vc-sodoc__footer-meta">Order ' + esc(d.orderNumber) + ' \u00b7 Page ' + num + ' of ' + total + '</div></footer>'
      + '</div></div></div>';
  }

  VC.serviceOrderDoc = function (d) {
    d = Object.assign({ oneTime: [], schedule: null, promo: null }, d);
    const t = computeTotals(d);
    const header = '<header class="vc-sodoc__header"><div><div class="vc-sodoc__title">Order</div><div class="vc-sodoc__subtitle">' + esc(d.orderDate) + ' <b>|</b> <b>No.</b> ' + esc(d.orderNumber) + '</div></div>' + LOGO() + '</header>'; // no gray rule under the main header (2026-10-27, per Catalina) — the beige band follows
    // Customer: the proposal's beige band (Prepared by / Prepared for); MSA: the proposal's black-bar box (2026-10-27).
    const band = (cols) => '<div class="vc-sodoc__band">' + cols.map(c => '<div><div class="vc-sodoc__band-label">' + esc(c[0]) + '</div>'
      + c.slice(1).map((v, i) => '<div class="' + (i ? 'vc-sodoc__band-muted' : '') + '">' + esc(v == null || v === '' ? '--' : v) + '</div>').join('') + '</div>').join('') + '</div>';
    const customerBand = band([
        ['Customer', d.customer.name, d.customer.address],
        ['Account number', d.customer.account],
        ['Contact', d.customer.contact],
        ['Prepared by', d.rep]
      ]);
    // Every page repeats the main header and the customer band (2026-10-27, per Catalina); the MSA box only on page 1.
    const pageTop = header + customerBand;
    const blocks = infoBlock('Master Service Agreement', [['MSA number', d.agreement.number], ['Term', d.agreement.term], ['Start date', d.agreement.start], ['End date', d.agreement.end], ['Ramp-up period', d.agreement.rampUp + ' days']], true);
    const page1 = pageTop + blocks
      + '<h3 class="vc-sodoc__section-title vc-sodoc__section-title--table">Subscriptions</h3>' // no "by bundle" in the title (2026-10-27, per Catalina)
      + servicesTable(d) + oneTimeTable(d) + totalsBlock(d, t);
    const page2 = pageTop
      + scheduleBlock(d) + termsBlock(d)
      + '<h3 class="vc-sodoc__section-title">Signatures</h3><p class="vc-sodoc__note">By signing, the customer orders the services above under the referenced Master Service Agreement.</p>'
      + signatureBlock(d.signed);
    return page(page1, 1, 2, d) + page(page2, 2, 2, d);
  };
})();
</script>
</head>
<body>
  <!-- Design page for the Service Order document (brief 36). Iterate here; the Contract step will render the same
       document with VC.serviceOrderDoc(). Simulation = which scenario the document shows. -->
  <div class="vc-sodoc-lab">
    <aside class="vc-sodoc-lab__panel" aria-label="Simulation">
      <h1 class="vc-sodoc-lab__title">Simulation Builder</h1>
      <p class="vc-sodoc-lab__desc">Order document: what the customer signs in DocuSign at the Contract step. Pick a scenario.</p>

      <div class="vc-sodoc-lab__group">Subscriptions</div>
      <label class="vc-check-row"><input type="checkbox" class="checkbox__input" data-sc="alacarte" checked onchange="render(this)"> À la carte subscriptions</label>
      <hr class="vc-sodoc-lab__divider">
      <label class="vc-check-row"><input type="checkbox" class="checkbox__input" data-sc="bundles" onchange="render(this)"> Bundles</label>
      <label class="vc-check-row vc-sodoc-lab__sub"><input type="checkbox" class="checkbox__input" data-sc="itemized" onchange="render()"> Show what each bundle includes</label>

      <div class="vc-sodoc-lab__group">Pricing</div>
      <label class="vc-check-row"><input type="checkbox" class="checkbox__input" data-sc="msaDiscount" checked onchange="render()"> MSA discount</label>
      <label class="vc-check-row"><input type="checkbox" class="checkbox__input" data-sc="promo" checked onchange="render()"> Promotion</label>
      <label class="vc-check-row"><input type="checkbox" class="checkbox__input" data-sc="oneTime" onchange="render()"> One-time charges (hardware, installation)</label>

      <div class="vc-sodoc-lab__group">Order</div>
      <label class="vc-check-row"><input type="checkbox" class="checkbox__input" data-sc="schedule" onchange="render()"> Order schedule (2 orders)</label>
      <label class="vc-check-row"><input type="checkbox" class="checkbox__input" data-sc="existing" onchange="render()"> Existing Business (co-term with MSA)</label>

      <div class="vc-sodoc-lab__group">DocuSign</div>
      <label class="vc-check-row"><input type="checkbox" class="checkbox__input" id="sc-docusign" onchange="render()"> Show signer fields</label>
    </aside>
    <main class="vc-sodoc-lab__doc" id="sodoc-viewer"></main>
  </div>
  <script>
    function scenario() {
      const sc = {};
      document.querySelectorAll('[data-sc]').forEach(el => { sc[el.dataset.sc] = el.checked; });
      return sc;
    }
    function render(changed) {
      // At least one kind of subscription: unchecking the last one checks the other.
      const b = document.querySelector('[data-sc="bundles"]'), a = document.querySelector('[data-sc="alacarte"]');
      if (!b.checked && !a.checked) (changed === b ? a : b).checked = true;
      const sc = scenario();
      const itemized = document.querySelector('[data-sc="itemized"]');
      itemized.closest('label').classList.toggle('hidden', !sc.bundles); // only with Bundles on (2026-10-27)
      if (!sc.bundles) { itemized.checked = false; sc.itemized = false; }
      const viewer = document.getElementById('sodoc-viewer');
      viewer.innerHTML = VC.serviceOrderDoc(VC.serviceOrderDemoData(sc));
      viewer.classList.toggle('vc-sodoc--docusign', document.getElementById('sc-docusign').checked);
    }
    render();
  </script>
</body>
</html>
