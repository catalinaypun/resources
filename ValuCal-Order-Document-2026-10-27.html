.segmented-control__option:focus-visible {
  outline: 2px solid var(--color-black);
  outline-offset: 2px;
}
.segmented-control--disabled {
  opacity: 0.45;
  pointer-events: none;
}

/* ---- Account summary panel (custom organism) ----------------------------
   Shared shell for account/MSA context and completed-pilot summaries.
   Values, section visibility and action menus are supplied by each flow. */
.vc-account-summary {
  margin-bottom: 16px;
  padding: 8px 16px;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  background: var(--white);
}
.vc-account-summary--split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.vc-account-summary--split > .vc-account-summary__section { min-width: 0; }
.vc-account-summary--split > .vc-account-summary__section--divided {
  margin-top: 0;
  padding-top: 0;
  padding-left: 16px;
  border-top: 0;
  border-left: 1px solid var(--gray-200);
}
.vc-account-summary__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 40px;
  margin-bottom: 2px;
}
.vc-account-summary__header-title,
.vc-account-summary__section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--black);
}
.vc-account-summary__actions { flex: 0 0 auto; }
.vc-account-summary__section--divided {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--gray-200);
}
.vc-account-summary__section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.vc-account-summary__section-title { margin-bottom: 0; }
.vc-account-summary__section-actions { flex: 0 0 auto; }
.vc-account-summary__metrics {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 12px 0;
}
.vc-account-summary__metric {
  flex: 0 1 auto;
  min-width: 128px;
  margin-right: 16px;
  padding-left: 16px;
  border-left: 1px solid var(--gray-200);
}
.vc-account-summary__metric:last-child { margin-right: 0; }
.vc-account-summary__metric:first-child {
  padding-left: 0;
  border-left: 0;
}
.vc-account-summary__label {
  margin-bottom: 2px;
  color: var(--gray-500);
  font-size: 11px;
  font-weight: 700;
}
.vc-account-summary__value {
  color: var(--black);
  font-size: 13px;
  font-weight: 400;
}
@media (max-width: 640px) {
  .vc-account-summary--split { grid-template-columns: minmax(0, 1fr); }
  .vc-account-summary--split > .vc-account-summary__section--divided {
    margin-top: 12px;
    padding: 12px 0 0;
    border-top: 1px solid var(--gray-200);
    border-left: 0;
  }
  .vc-account-summary__metric { flex: 1 1 140px; }
  .vc-account-summary__metric:nth-child(odd) { padding-left: 0; border-left: 0; }
}

/* ---- Utility: hidden (2026-10-21) — used by shared components (search field clear, tabs indicator, …);
   moved here from Unified/index.html so any page with shared-components.css gets it. */
.hidden { display: none !important; }

/* ---- Tabs: VDS Tabs, adjusted size (2026-10-07, per Catalina) ------------
   Not in the vendored VDS stylesheet, so implemented here from the VDS Figma spec (active red, 4px indicator).
   VDS only has Medium (12px) and Large (20px) labels; Valu Cal uses Large with a 16px / 20px label
   (20px read too big in dense screens like the drawer, 12px too small). A second line under the label
   (e.g. "(Discretionary)", 12px) is VDS "Custom Content" in the Tab Item slot. */
.tabs {
  display: flex;
  align-items: flex-end;
  gap: var(--space-6x);
  position: relative;
  border-bottom: var(--size-border-width, 1px) solid rgba(170, 168, 163, 0.4);
}
.tabs__item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  min-width: 44px;
  padding: var(--space-3x) 0;
  position: relative;
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font-family-etext);
  font-size: var(--font-size-body-large);
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-body-large);
  letter-spacing: 0;
  color: var(--color-primary);
  white-space: nowrap;
}
.tabs__item--active { color: var(--color-brand-red); }
.tabs__indicator {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 4px;
  border-radius: var(--radius-max);
  background: var(--color-brand-red);
}
.tabs__item:focus-visible {
  outline: 2px solid var(--color-black);
  outline-offset: 2px;
}

/* ---- Data visualization helpers (custom CSS) ----------------------------
   Chart chrome/helpers use official --color-dataviz-* tokens from the static
   Verizon stylesheet. These classes add Valu Cal's reusable presentation. */
:root {
  --dataviz-segment-gap: 2px;
  --dataviz-dash-pattern: 4, 3;
}
.dataviz-title {
  font-family: var(--font-family-etext);
  font-size: var(--font-size-body-large);
  font-weight: var(--font-weight-bold);
  color: var(--color-primary);
  margin: 0 0 var(--space-1x);
}
.dataviz-subtitle {
  font-family: var(--font-family-etext);
  font-size: var(--font-size-body-small);
  color: var(--color-secondary);
  margin: 0 0 var(--space-2x);
}
.dataviz-sum-total {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.dataviz-sum-total__value {
  font-family: var(--font-family-display);
  font-size: var(--font-size-title-xsmall);
  font-weight: var(--font-weight-bold);
  color: var(--color-primary);
  line-height: 1.1;
}
.dataviz-sum-total__label {
  font-size: var(--font-size-body-small);
  color: var(--color-secondary);
}
.dataviz-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3x) var(--space-4x);
  margin-top: var(--space-2x);
}
.dataviz-legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-2x);
  font-family: var(--font-family-etext);
  font-size: var(--font-size-body-small);
  color: var(--color-primary);
}
.dataviz-legend-indicator {
  width: 10px;
  height: 10px;
  border-radius: var(--radius-50);
  flex-shrink: 0;
}
.dataviz-legend-label { color: var(--color-primary); }
.dataviz-legend-value {
  margin-left: auto;
  color: var(--color-secondary);
  font-weight: var(--font-weight-bold);
}
.dataviz-data-value {
  font-family: var(--font-family-etext);
  font-size: var(--font-size-body-small);
  font-weight: var(--font-weight-bold);
  color: var(--color-primary);
}
.dataviz-hatch {
  background-image: repeating-linear-gradient(45deg, currentColor 0 2px, transparent 2px 6px);
  color: var(--color-dataviz-blue-600);
  opacity: 0.55;
}
.dataviz-meter-track {
  display: flex;
  gap: var(--dataviz-segment-gap);
  height: 8px;
  border-radius: var(--radius-max);
  overflow: hidden;
  background: var(--color-dataviz-neutral-track);
}
.dataviz-meter-track--progression { gap: 0; }
.dataviz-meter-segment { height: 100%; }
.dataviz-bar-row {
  display: flex;
  align-items: center;
  gap: var(--space-3x);
}
.dataviz-bar-track {
  flex: 1;
  height: 8px;
  border-radius: var(--radius-max);
  background: var(--color-dataviz-neutral-track);
  overflow: hidden;
}
.dataviz-bar-fill {
  height: 100%;
  border-radius: var(--radius-max);
  background: var(--color-dataviz-single-accent);
}
.dataviz-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 120px;
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-200);
  color: var(--color-secondary);
  font-size: var(--font-size-body-small);
  text-align: center;
  padding: var(--space-4x);
}

/* ---- Modal footer layout modifiers (VDS-aligned custom extension) -------
   Base modal and button components stay in design-system.css; these optional
   footer width treatments are a Valu Cal extension layered on that markup. */
.modal__actions .btn { flex: 1; }
.modal__actions--fill-container .btn { flex: 1 1 0; width: 100%; }
.modal__actions--auto { justify-content: flex-end; }
.modal__actions--auto .btn { flex: 0 0 auto; width: auto; }

/* ---- Page header (custom organism) -------------------------------------- */
.vc-page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
}
.vc-page-header__main {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.vc-page-header__title {
  margin: 0;
  color: var(--black);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.2;
}
.vc-page-header__subtitle {
  margin: 0;
  color: #1f1f1f;
  font-size: 14px;
  line-height: 1.35;
}
.vc-page-header__actions { flex: 0 0 auto; }
@media (max-width: 640px) {
  .vc-page-header { align-items: flex-start; flex-direction: column; gap: 16px; }
  .vc-page-header__actions { width: 100%; }
  .vc-page-header__actions .btn { width: 100%; }
}

/* ---- Bundle row ---------------------------------------------------------- */
.bundle-row {
  position: relative;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  margin-bottom: 8px;
  transition: background 0.15s;
  background: white;
  overflow: hidden;
}
.bundle-row-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.bundle-row-top { padding: 10px 12px 8px; position: relative; }
.bundle-row-bottom {
  padding: 10px 12px;
  border-top: 1px solid var(--gray-200);
  background: var(--gray-100);
}
.bundle-row-name {
  font-size: 14px;
  font-weight: 400;
  line-height: 1.3;
  color: var(--black);
  flex: 1;
  min-width: 0;
}

/* ---- Bundle stat row (per-bundle QTY/List/MSA/Monthly breakdown) --------- */
.bundle-stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
}
.bundle-stat-cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.bundle-stat-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-transform: none;
  color: var(--black);
  line-height: 1;
}
.bundle-stat-value {
  font-size: 13px;
  font-weight: 400;
  color: var(--black);
  line-height: 1.2;
}
.bundle-stat-value-strike {
  color: var(--gray-400);
  text-decoration: line-through;
  font-weight: 400;
  font-size: 11px;
  margin-right: 2px;
}
/* 4-column variant: per-bundle QTY/List Price/MSA Price/Monthly breakdown,
   Unified mode. Weighted columns give the Monthly cell (struck-through +
   final price pair) more room than an equal 4-way split would. */
.bundle-stat-row--4col {
  grid-template-columns: minmax(68px, 0.68fr) minmax(0, 1.1fr) minmax(0, 1.35fr) minmax(0, 1.1fr);
}

/* 2026-10-01 (per Catalina — "One Card" Pilot Edit Style simulation): a Pilot
   card, kept single instead of paired with a separate MSA-preview card. Its
   bundle rows default to 3 columns (QTY/List Price/Pilot Price, base
   .bundle-stat-row grid already gives 3 equal columns) and extend to 5 when
   the pilot's end action is Auto-convert to MSA (QTY/List Price/Pilot
   Price/MSA Price/Monthly) — the two added cells read from the companion
   option/bundle the same `ensureMsaPreviewOption` data source always builds,
   without a second visible card. */
.bundle-stat-row--3col-pilot {
  grid-template-columns: repeat(3, 1fr);
}
/* 2026-10-16: option summary with a "One-time charge" column (Simulation Builder option). */
.opt-totals-row.opt-totals-row--5col { grid-template-columns: minmax(56px, 0.6fr) minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1.1fr) minmax(0, 1fr); }
.bundle-stat-row--5col {
  grid-template-columns: minmax(50px, 0.55fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr);
}

/* ---- Discount badge: removed 2026-10-06 (per Catalina) — discounts use the
   VDS badge (.badge.badge--green / --blue). ---- */

/* ---- Option-level totals row (Qty/List/MSA/Monthly summary strip) -------- */
.opt-totals-row {
  display: grid;
  grid-template-columns: minmax(68px, 0.68fr) minmax(0, 1.1fr) minmax(0, 1.35fr) minmax(0, 1.1fr);
  gap: 0;
  background: var(--gray-100);
  border-radius: 8px;
  padding: 10px 10px;
}
.opt-totals-cell {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.opt-totals-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-transform: none;
  color: var(--black);
  line-height: 1;
}
.opt-totals-value {
  font-size: 15px;
  font-weight: 400;
  color: var(--black);
  line-height: 1.2;
}
.opt-totals-cell--final {
  position: relative;
}

/* Same One Card Pilot Edit Style 3/5-column variants, one level up (the
   option-level totals strip instead of a per-bundle row) — see
   .bundle-stat-row--3col-pilot / --5col above for the full rationale. */
.opt-totals-row--3col-pilot {
  grid-template-columns: repeat(3, 1fr);
}
.opt-totals-row--5col {
  grid-template-columns: minmax(50px, 0.55fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr);
}

/* "When this converts to MSA" strip — One Card Pilot Edit Style only, shown
   above the normal pilot summary/fields when Auto-convert to MSA is the
   pilot's end action. Houses the two fields that actually differ post-
   conversion (contract term + discounts/promotions), scoped to the
   companion option's id so edits read/write its data, not the pilot's own. */
/* 2026-10-02 (per Catalina): no gray container — the section sits directly
   on the card (inherits its background), introduced by a clear title so it
   reads as "here you configure the MSA that starts after the pilot". */
.one-card-msa-strip {
  margin-bottom: 10px;
  padding: 0;
  background: transparent;
  border-radius: 0;
}
.one-card-msa-strip-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--black);
  margin-bottom: 2px;
}
.one-card-msa-strip-caption {
  font-size: 11px;
  font-weight: 400;
  color: var(--gray-600);
  margin-bottom: 8px;
}
.one-card-msa-strip .opt-term-discount-row {
  margin-bottom: 8px;
}

/* ---- Subscription / price-list table shell -------------------------------- */
.sub-price-header {
  /* 2026-09-24 (per Catalina — "poner más grande el header y ponerlo en
     negro"): bumped from 9px/gray-600 to 12px/black to match the readable
     weight of the row cells below (.sub-price-cell), across both this
     table and the List Price tables that share the same class. */
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--black);
  text-align: left;
  padding: 5px 6px;
  border: 1px solid var(--gray-200);
}
.sub-price-header {
  white-space: normal;
  line-height: 1.15;
  vertical-align: bottom;
}
.sub-price-header--promo {
  /* 2026-09-25 (per Catalina — "podemos poner todas las celdas negras...
     solamente quedó como un pedacito"): the whole header cell is black,
     with the select/wrap made transparent so they blend into it. */
  background: var(--black);
  border: 1px solid var(--black);
  padding: 0;
}

/* ---- Option card shell (white card: bg/border/radius/width/shadow) -------
   2026-10-01 (per Catalina — "¿el fondo blanco, los bordes, la sombra...
   eso también lo tenemos ya homologado?"): both flows had this byte-for-byte
   identical except `overflow` — New Accounts used `visible`; Existing
   Accounts used `hidden`, with two local `:has()` escape-hatch rules to flip
   back to `visible` whenever a dropdown menu or the change-summary popover
   was open. Investigated whether `hidden` was protecting anything real in
   Existing: every actual clipping need there (bundle-row corners, header
   corners, the collapsed Current-panel state) already has its own
   independent `border-radius` + `overflow: hidden`, so the base rule wasn't
   doing anything the children didn't already do themselves. Per Catalina,
   unified both flows to `visible` here — Existing's two now-redundant
   `:has()` overrides were removed as dead code in that file. */
.option-card {
  background: white;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  width: 530px;
  flex-shrink: 0;
  overflow: visible;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

/* ---- Option card header (title + right-aligned action icons) ------------
   2026-10-01 (per Catalina — "homologuemos el encabezado... en ocasiones
   habrá que ocultarlos pero que el componente homologue esto"): both flows
   already showed a kebab/clone/delete icon cluster pinned to the right of
   the option card header, and both already needed to hide that whole
   cluster in certain entry points (MSA preview in New Accounts, Cancel MC
   in Existing Accounts) — but each flow did it with its own slightly
   different local CSS and an ad hoc inline `style="display:none"`. This
   homologates the shared shape: one header, one actions cluster, and one
   named hide state instead of an inline style duplicated per file.
   `overflow` is intentionally NOT set here — it's a real per-file
   difference (tied to each file's own .option-card overflow strategy) and
   stays as a small local override in each flow. */
.option-card-header {
  background: var(--black);
  color: white;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 700;
  border-radius: 8px 8px 0 0;
}
.option-card-header-actions {
  display: flex;
  align-items: center;
  /* 2026-10-22 (per Catalina): no gap — each 32px button already has 8px of air around its 16px icon (16px visible
     between icons); frees 16px for the option label. */
  gap: 0;
  margin-left: auto;
}
.option-card-header-actions button {
  background: transparent;
  border: none;
  cursor: pointer;
  color: rgba(255,255,255,0.7);
  padding: 2px;
}
/* Homologated hide hook — use this class instead of an inline style so the
   "sometimes hidden" behavior lives in one shared place. */
.option-card-header-actions--hidden {
  display: none;
}
/* 2026-10-16 (per Catalina): option tier at the right of the header, next to the actions, in white, no separator. */
.option-card-header-meta { display: inline-flex; align-items: center; margin-left: auto; margin-right: 8px; color: var(--white, #fff); font-size: 12px; font-weight: 700; white-space: nowrap; }
.option-card-header-meta .option-tier-meta-label { font-weight: 700; }
.option-card-header-meta .option-tier-meta-value { font-weight: 400; }
.option-card-header-meta + .option-card-header-actions { margin-left: 0; }
.option-card-header-meta:has(+ .option-card-header-actions--hidden) { margin-right: 0; }

/* ---- Discount/Promotions drawer — Custom Promotion type select ----------
   2026-10-01: both files already had this control nearly identical — the
   one real gap was Existing's `min-width: 132px` safeguard (keeps the pill
   from shrinking too narrow for its longest label), which New Accounts was
   missing. Homologated here by taking the safer, more defensive value. */
.custom-promo-type-select-wrap {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  min-width: 132px;
  height: 100%;
}
.custom-promo-type-select-wrap::after {
  content: '▾';
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 9px;
  color: var(--white, #fff);
  pointer-events: none;
}
.custom-promo-type-select {
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--white, #fff);
  text-transform: none;
  appearance: none;
  -webkit-appearance: none;
  border: none;
  border-radius: 0;
  background: transparent;
  width: 100%;
  height: 100%;
  padding: 5px 18px 5px 6px;
  margin: 0;
  cursor: pointer;
}
.custom-promo-type-select:hover,
.custom-promo-type-select:focus {
  background: #333;
  outline: none;
}
.custom-promo-back-icon-btn {
  background: none;
  border: none;
  padding: 2px;
  cursor: pointer;
  display: flex;
  align-items: center;
  color: var(--black);
  flex-shrink: 0;
}
/* 2026-10-01: New Accounts applied this via an inline style on each button
   (two occurrences) instead of a class rule — adopted Existing's cleaner
   class-based version here and removed the inline styles from New
   Accounts, per CLAUDE.md's no-inline-styles rule. Same visual result. */
.custom-promo-apply-btn {
  width: 100%;
  margin-top: 14px;
}

/* ---- Discount/Promotions drawer — duration timeline ----------------------
   2026-10-01: reconciled from two slightly different versions. Fixed a real
   bug found in Existing Accounts along the way — `.promo-timeline-legend-
   swatch` is a <span> with no `display: inline-block`, so its width/height
   were being silently ignored (the color swatch dot wasn't rendering at
   its intended 8×8 size). */
.promo-timeline-bar {
  position: relative;
  height: 14px;
  border-radius: 7px;
  background: var(--gray-300);
  overflow: hidden;
}
.promo-timeline-range {
  position: absolute;
  top: 0;
  height: 100%;
  background: var(--brand-blue);
  border-radius: 0 3px 3px 0;
}
.promo-timeline-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 10px;
  color: var(--gray-600);
}
.promo-timeline-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 4px;
  font-size: 10px;
  color: var(--gray-600);
}
.promo-timeline-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.promo-timeline-legend-label { color: var(--black); font-weight: 700; }
.promo-timeline-legend-swatch {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  display: inline-block;
}

/* ---- MSA Price cell + header tooltip (2026-10-02, per Leo 2026-10-01 call) --
   Shared by New Accounts and Existing Accounts Price List tables. Term/Tier
   and Discretionary are no longer broken out inside the MSA Price cell; a VDS
   tooltip on the header says both are already included. Capex rows split the
   cell into Monthly (subscription) and Hardware (one-time) sub-values. */
.sub-price-msa-header {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.sub-price-msa-tooltip .tooltip__trigger {
  width: 20px;
  height: 20px;
  min-width: 20px;
  min-height: 20px;
}
.sub-price-msa-tooltip .tooltip__popup {
  text-align: left;
  font-weight: 400;
}
.sub-price-msa-value {
  font-weight: 400;
}
.sub-price-msa-split {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  line-height: 1.5;
}
.sub-price-msa-split + .sub-price-msa-split {
  border-top: 1px solid var(--gray-200);
  margin-top: 2px;
  padding-top: 2px;
}
.sub-price-msa-split-label {
  color: var(--gray-600);
  font-size: 10px;
}

/* ---- Discount-level color coding (2026-10-02, per Leo 2026-10-01 call) -----
   Discounts and Promotions drawer: a number reduced at the MSA level
   (Tier/Term + Discretionary) reads green; a number reduced at the Order
   discount level (Promotion / Discount) reads blue. */
/* 2026-10-02 fix: each flow's own <style> loads AFTER this file and sets
   .bundle-summary-components-cell / .subscription-summary-line text to gray
   with the same specificity, so the plain classes were silently overridden.
   Scoped to the elements they're used on (higher specificity) so the colors
   always show. */
.price-amount--msa-discount,
.bundle-summary-components .bundle-summary-components-cell.price-amount--msa-discount,
.subscription-summary-totals .subscription-summary-line.price-amount--msa-discount > span:last-child {
  color: var(--color-green-800);
  font-weight: 600;
}
.price-amount--order-discount,
.bundle-summary-components .bundle-summary-components-cell.price-amount--order-discount,
.subscription-summary-totals .subscription-summary-line.price-amount--order-discount > span:last-child {
  color: var(--color-blue-800);
  font-weight: 600;
}

/* ---- Drawer Bundle Summary: Frequency column + hardware rows ---------------
   (2026-10-02, per Leo via Catalina.) Frequency sits right after
   Subscriptions (after Plan + QTY in the Plans table, so both tables keep
   their columns aligned). Capex-billed bundles add "One Time" hardware rows,
   shown slightly muted so they read as secondary to the subscriptions. */
.bundle-summary-components-header--freq,
.bundle-summary-components-cell--freq {
  width: 72px;
  text-align: left;
}
.bundle-summary-components-row--hardware .bundle-summary-components-cell {
  color: var(--gray-600);
}

/* ---- Compact segmented control (.segmented-pill) -----------------------------
   2026-10-02 (per Catalina): the small pill toggle first built for the
   Renewal / Rewrap switch in Existing Accounts' option-card header, promoted
   to a shared component so other places (e.g. Configure Bundle's Opex/Capex
   "Model" switch in New Accounts) reuse the exact same styles instead of
   re-declaring them. Named .segmented-pill (not .segment-pill) because
   .segment-pill is already the SMB/Enterprise/Government badge in both flows. Smaller than the VDS .segmented-control (44px) — this is
   for dense headers/panels.
   Default = light surfaces (beige/white panels); --on-dark = dark headers
   (the original Renewal/Rewrap look).
   Markup:
     <div class="segmented-pill" role="group" aria-label="...">
       <button type="button" class="segmented-pill__btn is-active" aria-pressed="true">A</button>
       <button type="button" class="segmented-pill__btn" aria-pressed="false">B</button>
     </div> */
.segmented-pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  /* 2026-10-02 (per Catalina): a very thin 2px inner padding — the active
     button sits almost flush against the control's outer edge. */
  padding: 2px;
  gap: 0;
  background: #E5E2DD;
}
.segmented-pill__btn {
  border: none;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  font-family: inherit;
  line-height: 1.2;
  cursor: pointer;
  background: transparent;
  color: var(--color-gray-600);
  white-space: nowrap;
}
.segmented-pill__btn.is-active {
  background: var(--color-white);
  color: #111;
}
.segmented-pill__btn:focus-visible {
  outline: 2px solid var(--color-black);
  outline-offset: 1px;
}
.segmented-pill--on-dark {
  background: rgba(255, 255, 255, .15);
}
.segmented-pill--on-dark .segmented-pill__btn {
  color: rgba(255, 255, 255, .72);
}
.segmented-pill--on-dark .segmented-pill__btn.is-active {
  background: #fff;
  color: #111;
}

/* ---- Solution row: aligned title, badges and row actions ----------------- */
.vc-solution-row .bundle-row-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}
.vc-solution-row .bundle-row-title { flex: 1 1 auto; min-width: 0; }
.vc-solution-row .bundle-row-name { overflow-wrap: anywhere; }
/* 2026-10-19 (per Catalina): solution subtitle (e.g. "Seasonal: Jun–Sep (4 months)"), right under the name. */
.bundle-row-subtitle { margin-top: 1px; font-size: 12px; line-height: 1.3; font-weight: 400; color: var(--black, #000); }
.vc-solution-row__tools {
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  flex: 0 0 auto;
  gap: 8px;
  min-width: 0;
}
.vc-solution-row__tools > div:not(.bundle-row-actions) { display: flex; align-items: center; gap: 4px; }
.vc-solution-row .bundle-row-badges {
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 4px;
}
.vc-solution-row .bundle-row-actions {
  position: relative;
  top: auto;
  right: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 4;
}
/* Hover mode (both flows): actions float over the top-right corner and only show on hover / focus,
   so they never reserve space in the row (same placement as before the shared row: 8px from the edges). */
.vc-solution-row--actions-hover .bundle-row-actions { position: absolute; top: -2px; right: -4px; display: none; z-index: 10; }
.vc-solution-row--actions-hover:hover .bundle-row-actions,
.vc-solution-row--actions-hover:focus-within .bundle-row-actions { display: flex; }
.vc-solution-row .bundle-row-header,
.vc-solution-row .bundle-row-bottom { position: relative; z-index: 4; }

@media (max-width: 480px) {
  .vc-solution-row .bundle-row-header { flex-wrap: wrap; }
  .vc-solution-row__tools { max-width: 100%; margin-left: auto; }
}

/* ---- Discounts & Promotions drawer: entry button + MSA/Order tabs ----------
   (2026-10-02, moved from New Accounts so Existing Accounts' Renewal / Rewrap
   uses the exact same drawer entry point and tab labels.) */
.btn-discounts-promotions { background: var(--white); border: 1.5px solid var(--black); border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 700; color: var(--black); cursor: pointer; font-family: 'VerizonNHGDS', sans-serif; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background 0.15s; }
.btn-discounts-promotions:hover { background: var(--gray-100); }
.btn-discounts-promotions .material-symbols-outlined { font-size: 16px; }
.discount-matrix-tab-sublabel { display: block; font-weight: 400; font-size: 12px; line-height: 16px; color: inherit; opacity: 0.7; } /* Tab Item Custom Content: second line, VDS small text */
.discount-matrix-tab-panel { margin-bottom: 8px; }

/* ---- Drawer Bundle Summary: group separator (2026-10-02, per Catalina) ----
   In a Plans table with Capex plans, each plan is a subscription row plus its
   "Hardware" row; a darker rule above each plan after the first separates
   one plan's pair from the next. */
.bundle-summary-components-row--group-start .bundle-summary-components-cell {
  border-top: 1px solid var(--gray-600);
}

/* ---- Price List "Sort: Subscription / Bundle" (2026-10-02, moved from New
   Accounts so Existing Accounts' Price List has the same control). ---------- */
.sub-price-list-sort {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
}
.sub-price-list-sort-icon {
  width: 12px;
  height: 12px;
  background-image: url("../ds/icons/sort.svg");
  background-repeat: no-repeat;
  background-size: contain;
  flex: 0 0 auto;
}
.sub-price-list-sort-label {
  font-size: 11px;
  font-weight: 400;
  color: var(--gray-500);
}
.sub-price-list-sort-select.vds-select {
  width: auto;
  height: auto;
  font-size: 11px !important;
  font-weight: 400;
  letter-spacing: normal;
  line-height: normal;
  color: var(--gray-500);
  background-color: transparent;
  background-image: none;
  border: none;
  border-radius: 0;
  box-shadow: none;
  padding: 0;
}
.sub-price-list-sort-select.vds-select:focus {
  border: none;
  outline: none;
}

/* 2026-10-02 (per Catalina): in the drawer's totals footer only the NUMBER is
   colored (green MSA Discount / blue Promotion / Discount) — the label reads
   black, regular weight. */
.subscription-summary-totals .subscription-summary-line.price-amount--msa-discount,
.subscription-summary-totals .subscription-summary-line.price-amount--order-discount { font-weight: 400; }
.subscription-summary-totals .subscription-summary-line.price-amount--msa-discount > span:first-child,
.subscription-summary-totals .subscription-summary-line.price-amount--order-discount > span:first-child { color: var(--color-black); font-weight: 400; }

/* ---- Pilot Price strip (2026-10-02, per Catalina / Leo Topic 7) ------------
   One Card pilot with Auto-convert to MSA: the card reads like a normal
   Initial Sales card and this small strip, under each bundle and under the
   option totals, states the pilot's own price ($0.00 when Free). */
.pilot-price-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  /* 2026-10-02 (per Catalina): light green (#e8f7ee),
     OUTSIDE the bundle's card but glued to its bottom edge — no gap — taking
     over the bundle card's bottom rounded corners. */
  margin: 0 0 8px;
  padding: 6px 12px;
  border-radius: 0 0 8px 8px;
  background: #e8f7ee;
  font-size: 11px;
  color: #0f6b34;
}
/* Option level: glued to the bottom of the totals strip, sharing its width
   and taking over its bottom rounded corners. */
.pilot-price-strip--option {
  margin: 0;
  padding: 7px 10px;
  border-radius: 0 0 8px 8px;
  font-size: 12px;
}
.opt-totals-row:has(+ .pilot-price-strip--option) { border-radius: 8px 8px 0 0; }
.bundle-row:has(+ .pilot-price-strip) { margin-bottom: 0; border-radius: 8px 8px 0 0; }
.pilot-price-strip:last-child { margin-bottom: 0; }
.pilot-price-strip-label { font-weight: 700; }
.pilot-price-strip-value { font-weight: 700; white-space: nowrap; }
.pilot-price-strip-value .bundle-stat-value-strike { font-weight: 400; margin-right: 2px; color: #0f6b34; opacity: 0.7; }
.pilot-price-strip-unit { font-weight: 400; font-size: 10px; }

/* ---- Dashed "+ Add" button (.btn-dashed-add) — 2026-10-02 ------------------
   Homologated from the identical local copies of .btn-add-bundle and
   .add-option-card in New Accounts and Existing Accounts. Two shapes:
     --pill  full-width pill inside a card ("+ Add Bundle", "+ Add modification")
     --card  large dashed card in the options grid ("+ Add option N")
   The old class names stay as aliases (and are still used by JS selectors),
   so markup can carry both, e.g. class="btn-dashed-add btn-dashed-add--pill btn-add-bundle".
   Not yet folded in: .ff-add-btn (Existing Accounts' Add Vehicles, gray-400
   border, 12px padding) and .msg-inline-add-btn (message editor) — similar
   look, different values; left local on purpose. */
.btn-dashed-add,
.btn-add-bundle,
.add-option-card {
  border: 1.5px dashed var(--gray-200);
  background: transparent;
  color: var(--black);
  font-family: 'VerizonNHGDS', sans-serif;
  font-weight: 700;
  cursor: pointer;
  box-sizing: border-box;
}
.btn-dashed-add:hover,
.btn-add-bundle:hover,
.add-option-card:hover {
  border-color: var(--black);
  color: var(--black);
}
.btn-dashed-add--pill,
.btn-add-bundle {
  width: 100%;
  padding: 10px;
  border-radius: 999px;
  font-size: 11px;
  margin-top: 8px;
}
.btn-dashed-add--card,
.add-option-card {
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  background: white;
  transition: all 0.15s;
}
/* Options-grid sizing for the "+ Add option" card (layout, not look). */
.add-option-card {
  width: 530px;
  flex-shrink: 0;
  min-height: 400px;
}

/* ---- Pilot summary title (2026-10-02, per Catalina) ------------------------
   "Pilot" title above the pilot's criteria (term | Free/Paid | end action),
   same weight/size as the "MSA configuration" title further down the card. */
.pilot-summary-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pilot-summary-title { font-size: 13px; font-weight: 700; color: var(--color-black); }

/* ---- Pilot Price strip: value aligned under Monthly (2026-10-02, per
   Catalina) ------------------------------------------------------------------
   The strip uses the same 4-column grid as the bundle stat row / option totals
   (QTY · List Price · MSA Price · Monthly) — the label spans the first three
   columns and the pilot price sits in the 4th, with the same 8px + 1px + 8px
   offset each cell gets from its left divider, so it lines up exactly under
   the Monthly value. The bundle-level strip also carries a transparent 1px
   side border to match the bundle card's own border. */
.pilot-price-strip,
.pilot-price-strip--option {
  display: grid;
  grid-template-columns: minmax(68px, 0.68fr) minmax(0, 1.1fr) minmax(0, 1.35fr) minmax(0, 1.1fr);
  gap: 0;
}
.pilot-price-strip { border: 1px solid transparent; border-top: 0; }
.pilot-price-strip--option { border: 0; }
.pilot-price-strip-label { grid-column: 1 / 4; }
.pilot-price-strip-value { grid-column: 4; padding-left: 8px; margin-left: 8px; border-left: 1px solid transparent; }

/* ---- Price List hardware row (2026-10-05, per Catalina) --------------------
   "<Bundle> Hardware" row right under a Capex bundle in the Price List
   (replaces the old "First month charge" column). Slightly indented and muted
   so it reads as belonging to the bundle above it. */
.sub-price-row--hardware .sub-price-cell { color: var(--color-gray-600); }
.sub-price-row--hardware .sub-price-cell--name { padding-left: 18px; }

/* ---- Drawer list header + "Clear selection" (2026-10-05, per Catalina) ----
   Title of each Discounts & Promotions list on the left, "Clear selection" on
   the right — only rendered when something in that list is selected. */
.discount-matrix-list-header { display: flex; justify-content: flex-end; align-items: baseline; gap: 12px; margin: 0 0 10px; }
.discount-matrix-list-header .discount-matrix-list-header-title { margin: 0; }
.discount-matrix-clear-link { white-space: nowrap; font-size: 12px; }

/* Custom Discount / Promotion builders: "requires approval" notice (2026-10-05).
   VDS warning notification (fill + left bar), compact: one line, 8px/12px
   padding, 13px text, 16px icon. */
.custom-approval-notice { margin: 0 0 12px; padding: 8px 12px; gap: 8px; align-items: center; font-size: 13px; line-height: 18px; }
.custom-approval-notice .notification__icon { font-size: 16px; width: 16px; height: 16px; flex: 0 0 16px; margin-top: 0; }
.custom-approval-notice .notification__message { margin: 0; font-size: 13px; line-height: 18px; }

/* Duration bar legend: "After promo" sits at the right end of the bar
   (2026-10-05, per Catalina) — Ramp-up / Promotion stay on the left. */
.promo-timeline-legend-item--end { margin-left: auto; }

/* Account term panel — top of the Proposal Dashboard for a pilot account
   (2026-10-05, per Leo / Catalina). Pilot info on the left; with
   Auto-convert, a vertical divider and the MSA it converts to on the right.
   Same look as Existing Accounts' MSA commitment panel. */
.account-term-panel {
  display: flex;
  align-items: stretch;
  gap: 20px;
  margin-bottom: 24px;
  padding: 10px 16px;
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: 8px;
}
.account-term-panel__section { flex: 1 1 0; min-width: 0; }
.account-term-panel__divider { width: 1px; flex: 0 0 1px; background: var(--gray-200); }
.account-term-panel__title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 700;
  color: var(--black);
}
.account-term-panel__metrics { display: flex; flex-wrap: wrap; gap: 8px 0; }
.account-term-panel__metric { padding: 0 16px; border-left: 1px solid var(--gray-200); }
.account-term-panel__metric:first-child { padding-left: 0; border-left: none; }
.account-term-panel__label { margin-bottom: 2px; font-size: 11px; font-weight: 700; color: var(--gray-500); }
.account-term-panel__value { font-size: 13px; color: var(--black); white-space: nowrap; }

/* ---- Select size S (2026-10-05, per Catalina) -------------------------------
   VDS only ships one select size (.select, 44px). Size S modifier for dense
   spots (tables, toolbars): same look — 1px black border, 8px radius, black
   caret — at 32px tall with 12px text, matching .btn--small. Width follows
   its content unless a container sets it. Use: class="select select--small". */
.select.select--small {
  display: inline-block;
  width: auto;
  min-height: 32px;
  padding: 6px 32px 6px 12px;
  font-size: var(--font-size-body-small);
  line-height: var(--line-height-body-small);
  letter-spacing: 0;
  background-position: right 8px center;
  background-size: 16px 16px;
}

/* VDS text input size S and affix wrapper for dense fields and tables. */
.input.input--small {
  min-height: 32px;
  padding: 6px 8px;
  font-size: var(--font-size-body-small);
  line-height: var(--line-height-body-small);
}
.input-affix {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-sizing: border-box;
  width: 100%;
  min-height: 32px;
  padding: 6px 8px;
  color: var(--color-primary);
  background-color: transparent;
  border: 1px solid var(--color-black);
  border-radius: var(--radius-input);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input-affix:focus-within {
  border-color: var(--color-black);
  box-shadow: inset 0 0 0 1px var(--color-black);
}
.input-affix__text {
  flex: 0 0 auto;
  color: var(--color-secondary);
  font-size: var(--font-size-body-small);
  line-height: var(--line-height-body-small);
  pointer-events: none;
}
.input-affix--compact { width: 96px; max-width: 100%; }
.contract-discount-table .input-affix--compact { width: 100%; }
.input-affix .input-affix__field {
  display: block;
  flex: 1 1 auto;
  width: 100%;
  min-width: 0;
  min-height: 0;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
.input-affix .input-affix__field:focus { border-color: transparent; box-shadow: none; }
.input-affix:has(.input-affix__field:disabled) { opacity: 0.17; cursor: not-allowed; pointer-events: none; }
.input-affix .input-affix__field:disabled { opacity: 1; cursor: inherit; pointer-events: none; }
.input-affix:has(.input-affix__field.input--error) { background-color: var(--color-orange-200); border-color: var(--color-orange-1000); }
.input-affix:focus-within:has(.input-affix__field.input--error) { box-shadow: inset 0 0 0 1px var(--color-orange-1000); }
.input-affix .input-affix__field.input--error { background-color: transparent; border-color: transparent; }

/* ---- Account Level section (2026-10-05, per Catalina) ---------------------
   Above an option card's Solutions: a strip ("Account Level Features", same
   look as the Solutions header) and a card listing account-configured
   features (e.g. Roadside Assistance) with a check and their price. The
   Solutions header that follows gets the --section modifier. */
.bundles-label.bundles-label--section { margin: 12px -10px 10px; border-top: 1px solid var(--gray-200); }
.bundles-label .account-level-icon { font-size: 20px; }
.account-level-card {
  padding: 12px 12px 4px;
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: 8px;
}
.account-level-card .account-level-row { margin-bottom: 8px; font-size: 13px; }
.account-level-row .account-level-name { flex: 1 1 auto; }
.account-level-row .account-level-price { font-variant-numeric: tabular-nums; }

/* ============================================================================
   COMPONENTIZATION — batch 1: Solution row family (2026-10-06)
   Rendered by assets-shared/js/vc-components.js (VC.sectionStrip,
   VC.solutionRow, VC.statRow, VC.badge). Values below were identical in
   Initial Sales and Existing Accounts unless noted; where they differed,
   Initial Sales' value is the baseline (see ValuCal-MSA/componentization/component-library.html).
   The flows still carry their own local copies until each component is
   wired in (next step) — same values, so nothing changes visually.
   ========================================================================== */
.bundles-list { margin: 20px -14px -14px; padding: 10px; border-top: 1px solid var(--gray-200); border-radius: 0 0 8px 8px; overflow: hidden; background: var(--white); }
.bundles-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -10px -10px 10px; padding: 8px 12px; background: #F8F3E9; border-bottom: 1px solid var(--gray-200); font-size: 13px; font-weight: 700; color: var(--black); }
.bundles-label-left { display: flex; align-items: center; gap: 8px; }
.bundles-label-right { display: flex; align-items: center; gap: 10px; }
.bundles-label-divider { width: 1px; height: 14px; background: var(--gray-200); }
.bundles-label .bundles-label-icon { font-size: 20px; }

.bundle-row:last-child { margin-bottom: 0; }
.bundle-row::after { content: ''; position: absolute; inset: 0; background: var(--white); opacity: 0; transition: opacity 0.15s; z-index: 3; pointer-events: none; }
.bundle-row:hover::after { opacity: 0.5; }
.bundle-row:hover .bundle-row-actions { display: flex; }
.bundle-row.bundle-row--added { border-color: #15803D; }
.bundle-row.bundle-row--reduced,
.bundle-row.bundle-row--cancelled { border-color: #B42318; }
.bundle-row-top { position: relative; padding: 10px 12px 8px; }
.bundle-row-bottom { padding: 10px 12px; background: var(--gray-100); border-top: 1px solid var(--gray-200); }
.bundle-row-actions { position: absolute; top: 8px; right: 8px; z-index: 10; display: none; gap: 8px; }
.bundle-row-title { flex: 1; min-width: 0; }
.bundle-row-eyebrow { margin-bottom: 2px; font-size: 12px; font-weight: 700; color: var(--black); }
.bundle-row-badges { flex-shrink: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.bundle-feature-line { margin-top: 1px; font-size: 11px; line-height: 1.3; color: var(--gray-600); }
.bundle-feature-line strong { font-weight: 700; color: #5f5f5f; }

/* Stat row spacing: 8px — standardized with Initial Sales (Catalina, 2026-10-06). */
.bundle-stat-cell + .bundle-stat-cell { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--gray-200); }
.bundle-stat-row--4col .bundle-stat-cell { min-width: 0; }
.bundle-stat-cell:last-child .bundle-stat-value { font-weight: 700; }
/* Unit suffix ("/units"): 9px — standardized with Initial Sales (Catalina, 2026-10-06). */
.bundle-stat-value span { font-size: 9px; font-weight: 400; color: var(--gray-600); }
.opt-totals-capex-note { margin-top: 2px; font-size: 9px; color: var(--gray-600); white-space: nowrap; }


/* ---- Account feature list (VC.accountFeatureList) — batch 1, 2026-10-06 ----
   Content under the "Account Level Features (N)" strip: VDS checkbox + label
   on the left, price on the right, one line per feature. */
.account-feature-list { padding: 4px 12px; background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; }
.account-feature-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.account-feature-item + .account-feature-item { border-top: 1px solid var(--gray-200); }
.account-feature-check { flex: 1 1 auto; min-width: 0; align-items: center; }
/* VDS checkbox kept as is (20px box); text at the option card's 13px scale. */
.account-feature-list .account-feature-check,
.account-feature-price { font-size: 13px; line-height: 18px; letter-spacing: 0; }
.account-feature-price { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---- Full-width helper for VDS buttons (buttons batch, 2026-10-06) -------- */
.btn.btn-block { display: flex; width: 100%; }

/* ---- VDS Icon Button — kinds missing from the vendored design-system.css --
   Taken from the VDS Figma library ([VDS] Icon Button, 2026-10-06):
   kind "Low Contrast - Solid" = white + 1px #DDDAD4 border; elevation
   "Middle" = white + shadow (0 1px 8px 8% / 0 2px 14px 6%); size Small = 32px,
   16px icon. The vendored CSS only has --default / --ghost and a 28px small. */
.btn-icon.btn-icon--solid { background-color: var(--white); border: 1px solid #DDDAD4; color: var(--black); }
.btn-icon.btn-icon--elevation-middle { background-color: var(--white); border-color: transparent; box-shadow: 0 1px 8px rgba(0,0,0,0.08), 0 2px 14px rgba(0,0,0,0.06); }
.btn-icon.btn-icon--vds-small { width: 32px; height: 32px; min-width: 32px; min-height: 32px; padding: 0; }
.btn-icon.btn-icon--vds-small .material-symbols-outlined { font-size: 16px; }
/* Hover per VDS Figma: Solid → the light gray border doubles (1px inside +
   1px outside), no black; elevation Middle → the shadow grows slightly. */
.btn-icon.btn-icon--solid:hover { box-shadow: 0 0 0 1px #DDDAD4, 0 0 0 2px var(--white); }
.btn-icon.btn-icon--elevation-middle:hover { box-shadow: 0 1px 10px rgba(0,0,0,0.08), 0 3px 18px rgba(0,0,0,0.06); }

/* ---- VDS Icon Button: Ghost / Low Contrast · Tonal (from VDS Figma, 2026-10-06)
   Ghost: transparent, hover = rgba(170,168,163,.12) fill. Small 32px / 20px
   icon · Large 44px / 24px icon · fit-to-icon 20px (no padding).
   Tonal: rgba(170,168,163,.12) fill, Small 32px / 16px icon. */
.btn-icon.btn-icon--ghost-vds { background-color: transparent; color: var(--black); }
.btn-icon.btn-icon--ghost-vds:hover { background-color: rgba(170,168,163,0.12); }
.btn-icon.btn-icon--tonal { background-color: rgba(170,168,163,0.12); color: var(--black); }
.btn-icon.btn-icon--tonal:hover { box-shadow: 0 0 0 1px rgba(170,168,163,0.4); }
.btn-icon.btn-icon--ghost-vds.btn-icon--vds-small .material-symbols-outlined { font-size: 20px; }
.btn-icon.btn-icon--vds-large { width: 44px; height: 44px; min-width: 44px; min-height: 44px; padding: 0; }
.btn-icon.btn-icon--vds-large .material-symbols-outlined { font-size: 24px; }
.btn-icon.btn-icon--fit { width: 20px; height: 20px; min-width: 20px; min-height: 20px; padding: 0; }
.btn-icon.btn-icon--fit .material-symbols-outlined { font-size: 20px; }

/* ---- VDS Text Link (from VDS Figma, 2026-10-06) ---------------------------
   Black, regular weight, 1px underline (2px on hover). Small 12/16 · Large 16/20.
   Works on <a> or <button>. */
.text-link { display: inline; padding: 0; background: none; border: none; color: var(--black); font-family: 'VerizonNHGDS', sans-serif; font-weight: 400; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; cursor: pointer; }
.text-link:hover { text-decoration-thickness: 2px; }
.text-link--small { font-size: 12px; line-height: 16px; }
.text-link--large { font-size: 16px; line-height: 20px; }

/* ---- VDS Input Stepper (from VDS Figma "[VDS] Input Stepper", 2026-10-06) --
   Pill with a 1px black border; − / + are transparent round buttons (gray
   tonal fill on hover); the value is bold and centered.
   Large: 44px tall, 6px side padding, 8px gap, 32px buttons, 20px icons, 16px value.
   Small: 32px tall, 4px side padding, 4px gap, 24px buttons, 16px icons, 12px value.
   Markup:
     <div class="input-stepper input-stepper--large">
       <button type="button" class="input-stepper__btn" aria-label="Decrease"><span class="material-symbols-outlined">remove</span></button>
       <input class="input-stepper__value" type="number" value="5" aria-label="Quantity">
       <button type="button" class="input-stepper__btn" aria-label="Increase"><span class="material-symbols-outlined">add</span></button>
     </div> */
.input-stepper { display: inline-flex; align-items: center; border: 1px solid var(--black); border-radius: 9999px; background: transparent; }
.input-stepper--large { height: 44px; padding: 0 6px; gap: 8px; }
.input-stepper--small { height: 32px; padding: 0 4px; gap: 4px; }
.input-stepper__btn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; border: none; border-radius: 50%; background: transparent; color: var(--black); cursor: pointer; }
.input-stepper__btn:hover { background-color: rgba(170,168,163,0.12); }
.input-stepper__btn:disabled { color: var(--gray-400); cursor: not-allowed; background: transparent; }
.input-stepper--large .input-stepper__btn { width: 32px; height: 32px; }
.input-stepper--large .input-stepper__btn .material-symbols-outlined { font-size: 20px; }
.input-stepper--small .input-stepper__btn { width: 24px; height: 24px; }
.input-stepper--small .input-stepper__btn .material-symbols-outlined { font-size: 16px; }
.input-stepper__value { width: 3ch; min-width: 24px; padding: 0; border: none; background: transparent; color: var(--black); font-family: 'VerizonNHGDS', sans-serif; font-weight: 700; text-align: center; -moz-appearance: textfield; appearance: textfield; }
.input-stepper__value::-webkit-outer-spin-button, .input-stepper__value::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.input-stepper__value:focus { outline: none; }
.input-stepper--large .input-stepper__value { font-size: 16px; line-height: 20px; }
.input-stepper--small .input-stepper__value { font-size: 12px; line-height: 16px; }

/* ── Record link (custom atom, 2026-10-06) ──────────────────────────────
   VDS has no blue link. Blue = navigates to a record or document
   (proposal, opportunity, contract, PDF). In-screen actions use the VDS
   black .text-link instead. */
.record-link { padding: 0; border: none; background: none; color: #0076ce; font: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #93c5fd; cursor: pointer; }
.record-link:hover { color: #005fa3; text-decoration-color: #005fa3; }

/* ── Kebab menu (custom molecule, 2026-10-06) ───────────────────────────
   VDS has no menu component. Trigger = VDS Icon Button Tonal Small (⋮);
   panel = list of actions, anchored to the trigger's right edge.
   Markup: .kebab-menu > button.btn-icon… + .kebab-menu__panel[.hidden] >
   .kebab-menu__item[--danger|.is-disabled] / __label / __divider */
.kebab-menu { position: relative; display: inline-flex; }
.kebab-menu__panel { position: absolute; top: calc(100% + 4px); right: 0; z-index: 2000; min-width: 180px; padding: 8px 0; background: var(--white, #fff); border: 1px solid var(--gray-200, #e7e5e2); border-radius: 8px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15); text-align: left; }
.kebab-menu__panel--above { top: auto; bottom: calc(100% + 4px); }
.kebab-menu__panel.hidden { display: none; }
.kebab-menu__panel--left { right: auto; left: 0; }
.kebab-menu__item { display: block; width: 100%; padding: 8px 16px; border: none; background: transparent; color: var(--black, #000); font-family: 'VerizonNHGDS', sans-serif; font-size: 13px; text-align: left; white-space: nowrap; cursor: pointer; }
.kebab-menu__item:hover { background: var(--gray-100, #f6f6f6); }
.kebab-menu__item--danger { color: var(--red, #d52b1e); }
.kebab-menu__item--danger:hover { background: #fdedee; }
.kebab-menu__item.is-disabled, .kebab-menu__item:disabled { color: #aaa7a3; cursor: not-allowed; pointer-events: none; }
.kebab-menu__label { padding: 10px 16px 4px; font-size: 12px; font-weight: 700; color: var(--black, #000); }
.kebab-menu__divider { height: 1px; margin: 4px 0; background: var(--gray-200, #e7e5e2); }
/* 2026-10-23 (Pricing Desk role switcher): items with a description (VC.kebabMenu item.description) — two-line text on
   the left, the selected check on the right at the dropdown's 18px. */
.kebab-menu__item--described { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.kebab-menu__item--described .material-symbols-outlined { flex: 0 0 auto; font-size: 18px; }

/* ── Section strip (custom molecule) ──────────────────────────────────── */
.bundles-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;

}

.bundles-label-right { display: flex; align-items: center; gap: 10px; }
.bundles-label-divider { width: 1px; height: 14px; background: var(--gray-200); }

/* ── Proposal dashboard table (custom organism shell) ─────────────────── */
.ql-table-wrap { background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; overflow: hidden; }
.ql-table-wrap:has(.ql-actions-wrap .kebab-menu__panel:not(.hidden)) { overflow: visible; }
.ql-table { width: 100%; border-collapse: collapse; }

/* 2026-10-13 (per Catalina): no row hover on the Proposal Dashboard — only the Proposal ID link is interactive. */

.ql-actions-wrap { position: relative; display: inline-flex; }

/* ── Application header (custom organism) ─────────────────────────────── */
.vc-header {

  gap: 0;
}
.vc-header-logo { display: flex; align-items: center; gap: 10px; padding: 0 16px 0 12px; border-right: none; flex-shrink: 0; position: relative; z-index: 2; }
.vc-logo-wrap { display: flex; flex-direction: column; align-items: flex-start; width: 136px; }
.vc-logo-name { font-size: 29px; font-weight: 700; line-height: 0.95; }
.vc-logo-name em { color: var(--color-brand-limitedred, var(--red, #ee001e)); font-style: normal; }
.vc-logo-sub { font-size: 14px; color: var(--gray-600); margin-top: 4px; }
.vc-header-right { display: flex; align-items: center; gap: 10px; height: 100%; border-left: 1px solid var(--gray-200); padding: 0 16px; margin-left: 0; flex-shrink: 0; background: transparent; position: relative; z-index: 2; }
.vc-header-right--interactive { cursor: pointer; transition: background 0.18s ease, box-shadow 0.18s ease; }

.vc-account-heading-row { display: flex; align-items: center; gap: 10px; }
.vc-account-heading { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vc-account-info > .badge-pending, .vc-account-info > .badge-ready { margin-left: 30px; }
.vc-header-right--interactive:hover .account-entry-chevron { opacity: 1; transform: translateX(0); }

.vc-current-setup-filter { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; }

/* 2026-10-15 (per Catalina): Contract Account filter on the Current setup title row (label inline, borderless dropdown). */
.current-proposal-header-filters { margin-left: auto; min-width: 0; }
.vc-current-setup-filter--inline { flex-direction: row; align-items: center; gap: 2px; margin: 0; }
/* No label (2026-10-15, per Catalina): the options name the filter ("All contract accounts", or the account). */
.current-proposal-card .current-proposal-title { white-space: nowrap; }
.current-proposal-panel.is-collapsed .current-proposal-header-filters { display: none; }
@media (max-width: 480px) {

}
.account-entry-chevron { font-size: 14px; color: var(--gray-600); opacity: 0.5; transform: translateX(-2px); transition: opacity 0.18s ease, transform 0.18s ease; }
.badge-pending { background: #FFCD27; color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 2px; display: inline-flex; align-items: center; gap: 2px; width: fit-content; white-space: nowrap; cursor: pointer; letter-spacing: 0.01em; }

.vc-header--preview .vc-nav { position: relative; left: auto; transform: none; flex: 1 1 auto; justify-content: center; }
.vc-header--preview .vc-header-right { cursor: default; }

/* ── Workflow stage stepper (custom organism) ─────────────────────────── */

  flex: 0 0 auto;
  display: flex;
  align-items: stretch;
  height: 72px;
  overflow: visible;
  min-width: 0;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
}
.ns-wrap {
  display: flex;
  align-items: stretch;
  height: 72px;
  min-width: 0;
  flex-shrink: 0;
  position: relative;
}
.ns-wrap.active-phase,
.ns-wrap.collapsed-phase { margin-left: -12px; }
.ns-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 10px 20px;
  gap: 0;
  flex-shrink: 0;
  position: relative;
}
.ns-cell.ns-active { background: #F8F3E9; border-bottom: 1px solid #000; }
.ns-cell.ns-done { background: #fff; border-left: 1px solid #DDDAD4; }
.ns-wrap.ns-first .ns-cell { border-left: none !important; }
.ns-cell.ns-pending { background: #F8F7F5; }

.ns-content {
  display: flex;
  flex-direction: column;

  gap: 4px;
  min-width: 168px;
  flex-shrink: 0;
}
.ns-circle {

}
.ns-circle.active { background: #000; color: #fff; }

.ns-label {

}
.ns-label.active,
.ns-label.done { color: #000; }
.ns-label.pending { color: #716F6D; }
.ns-date {
  font-size: 10px;
  color: #716F6D;
  text-align: center;
  white-space: nowrap;
  min-width: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
/* 2026-10-21 (per Catalina): the latest state name before its date and time, bold and black. */
.ns-date-state { font-weight: 700; color: #000; margin-right: 2px; }
.ns-info-wrap {
  appearance: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  margin: 0 0 0 3px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #5c5a58;
  font: inherit;
  cursor: help;
}
.ns-info-wrap:hover,
.ns-info-wrap:focus-visible,
.ns-info-wrap.is-open { color: #2c2a28; }
.ns-info-wrap:focus-visible { outline: 2px solid #0066cc; outline-offset: 2px; border-radius: 2px; }
.ns-info-icon { display: block; width: 14px; height: 14px; font-size: 14px; line-height: 14px; }
.ns-tooltip-card {
  position: absolute;
  left: 50%;
  top: calc(100% + 14px);
  transform: translateX(-50%);
  width: max-content;
  min-width: 0;
  max-width: min(270px, 80vw);

  border: 1px solid #1f1f1f;

.ns-tooltip-label { font-weight: 400; }
.ns-tooltip-date { flex: 0 0 auto; color: #716f6d; font-size: 11px; white-space: nowrap; }
/* Brief 34: "View history" at the bottom of the milestones tooltip. */
.ns-tooltip-link { display: inline-block; margin-top: 6px; font-size: 11px; line-height: 14px; }
.ns-chevron {

.sidebar {
  position: fixed;
